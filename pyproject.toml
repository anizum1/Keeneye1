[project]
name = "keeneye"
version = "0.1.0"
description = "Chain-of-custody tracker for digital evidence, with a 3D examiner interface"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["flask>=3.0", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "playwright>=1.40"]

[project.scripts]
keeneye = "coc.cli:main"

[tool.ruff]
line-length = 108
target-version = "py311"
exclude = ["coc/web/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are caught by the formatter's judgement, not a hard stop
    "B008",    # Flask and argparse idioms rely on calls in defaults
    "SIM105",  # contextlib.suppress is not always clearer than try/except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:coc.*"]
